name: Publish Python package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify before publishing (must match pyproject.toml)"
        required: false
        default: "1.0.0"

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository and LFS model
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify bundled model
        shell: python
        run: |
          from pathlib import Path

          model = Path("pyocrcaptcha/models/captcha-character-classifier-yolo11n-100e.pt")
          assert model.exists(), f"Missing model: {model}"
          assert model.stat().st_size > 3_000_000, "Model is missing or is only a Git LFS pointer"
          print(f"Verified model: {model} ({model.stat().st_size:,} bytes)")

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify package version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          expected = os.environ.get("RELEASE_TAG") or os.environ.get("INPUT_VERSION") or "1.0.0"
          expected = expected.removeprefix("v").removeprefix("V")
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          actual = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE).group(1)
          assert actual == expected, f"Expected version {expected}, found {actual}"
          print(f"Verified version: {actual}")
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}

      - name: Verify model inside wheel
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          member = "pyocrcaptcha/models/captcha-character-classifier-yolo11n-100e.pt"
          with ZipFile(wheel) as archive:
              info = archive.getinfo(member)
          assert info.file_size > 3_000_000, "Built wheel contains an invalid model"
          print(f"Verified {member} in {wheel.name}: {info.file_size:,} bytes")

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyocrcaptcha
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
