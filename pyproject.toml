[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyocrcaptcha"
version = "1.0.0"
description = "YOLO-based fixed-width image CAPTCHA OCR"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Moxin1044"}]
dependencies = ["ultralytics>=8.3.0", "Pillow>=10.0.0"]
keywords = ["captcha", "ocr", "yolo", "computer-vision"]

[project.scripts]
pyocrcaptcha = "pyocrcaptcha.cli:main"

[tool.setuptools.packages.find]
include = ["pyocrcaptcha*"]

[tool.setuptools.package-data]
pyocrcaptcha = ["models/*.pt"]
